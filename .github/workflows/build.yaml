name: build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2

      - name: Cache pinned Chrome for Puppeteer
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/puppeteer-cache
          key: puppeteer-${{ runner.os }}-${{ hashFiles('scripts/bun.lock') }}
          restore-keys: puppeteer-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Install preview-only gallery tools
        run: bun install --cwd scripts --frozen-lockfile
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer-cache

      - name: Build app and gallery report
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer-cache
          BASELINE_URL: ${{ github.event_name == 'pull_request' && 'https://latest.connect-d5y.pages.dev' || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          VITE_APP_GIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PREVIEW: '1'
        run: |
          export VITE_APP_GIT_TIMESTAMP="$(git show -s --format=%cI)"
          args=(--output ./dist --head-sha "$HEAD_SHA")
          if [[ -n "$BASELINE_URL" ]]; then
            args+=(--baseline-url "$BASELINE_URL")
          fi
          bun run build:gallery -- "${args[@]}"

      - name: Upload built project
        uses: actions/upload-artifact@v4
        with:
          path: ./dist
          overwrite: true
          retention-days: 1
          name: build-artifacts-${{ github.run_id }}
