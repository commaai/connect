name: test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test

  playback:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chromium,webkit
          - os: macos-latest
            browsers: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bun install --frozen-lockfile

      - name: Check playback scripts
        run: bun x --no-install oxlint -A all -D no-undef -D no-unused-vars scripts/generate-playback-fixtures.mjs scripts/test-playback.mjs scripts/test-public-playback.mjs

      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg

      - name: Install playback tooling
        run: |
          bun add --no-save playwright@1.62.1
          node node_modules/playwright/cli.js install --with-deps ${{ matrix.os == 'ubuntu-latest' && 'chromium webkit' || 'webkit' }}

      - name: Test decoded playback without hardware
        run: node scripts/test-playback.mjs --browser ${{ matrix.browsers }}

      - name: Save playback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-report-${{ matrix.os }}
          path: |
            test-results/playback-report.json
            test-results/playback-failure.png
            test-results/playback-preview.png
            test-results/controls-*.png
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [test]
    if: github.repository == 'commaai/connect' && github.ref == 'refs/heads/master'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/commaai/connect
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr,prefix=
            type=sha,format=long,prefix=
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true

      - name: get date
        run: echo "GIT_TIMESTAMP=$(git show -s --format=%cI)" >> $GITHUB_ENV

      - uses: docker/build-push-action@v5
        with:
          build-args: |
            VITE_APP_GIT_SHA=${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
            VITE_APP_GIT_TIMESTAMP=${{ env.GIT_TIMESTAMP }}
            VITE_POSTHOG_KEY=phc_4VfSi5FAChlAt5keSrxVWCaVyZTsYpFKqz2Bw60KLz
            VITE_POSTHOG_HOST=https://us.i.posthog.com
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_RELEASE=${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
