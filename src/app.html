    <!-- Loaded off the critical path: an @import in index.css chained a
         third-party request in front of first paint. font-display: swap means
         the fallback shows immediately either way. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <title>connect</title>

    <!-- Plausible.io -->
    <script defer data-domain="connect.comma.ai" src="https://plausible.io/js/script.js"></script>

    %sveltekit.head%
    <!--
      Stamp the theme before first paint, so a light-mode visitor never sees the
      dark app flash. Deliberately duplicates src/lib/state/theme.svelte.js: this
      has to run inline, ahead of any module, and the two must agree.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
